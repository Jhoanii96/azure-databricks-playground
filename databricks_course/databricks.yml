# Databricks Asset Bundle configuration for LLMOps Course
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation

bundle:
  name: course-code-hub

artifacts:
  default:
    type: whl
    build: uv build
    path: .

variables:
  git_sha:
    description: git_sha
    default: abcd
  branch:
    description: branch
    default: main
  schedule_pause_status:
    description: schedule pause status
    default: PAUSED
  run_as_user:
    description: "Service Principal ID o User para ejecutar el job"
    default: "gointegreat.support@gointegreat.com"  # cambiar según target

include:
  - resources/*.yml

targets:
  dev:
    default: true
    mode: development
    workspace:
      host: https://adb-7405618145949592.12.azuredatabricks.net/
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.target}/${bundle.name}

  prd:
    mode: production
    workspace:
      host: https://adb-7405614367462758.18.azuredatabricks.net/
      root_path: /Shared/.bundle/${bundle.target}/${bundle.name}
    variables:
      schedule_pause_status: PAUSED # Set to UNPAUSED to enable scheduled runs in production
